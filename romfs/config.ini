; flash3ds Virtual Console -- default game configuration.
;
; This is the documented default: every value here is ALSO the built-in
; fallback GameConfig::defaults() uses if config.ini is missing entirely
; (see src/vc/GameConfig.h/.cpp) -- so "no config.ini" and "config.ini with
; exactly these values" behave identically. See docs/virtual-console.md
; for the full syntax reference and how to replace romfs/game.swf with a
; different SWF without recompiling the runtime.

[game]
swf=game.swf

[input]
A=ENTER
B=ESCAPE
X=SPACE
Y=SHIFT
L=L
R=R
ZL=Z
ZR=V
START=ENTER
; SELECT=END (2026-08-30): matches CondKeyPress=4 ("End") that every real
; Hobo game's frame-1 buttons gate on -- see GameConfig.h's selectKeyCode
; doc comment and docs/known-limitations.md L11 for the evidence.
SELECT=END
CSTICK_UP=I
CSTICK_DOWN=K
CSTICK_LEFT=J
CSTICK_RIGHT=M

[touch]
enabled=true
screen=bottom

[mouse]
enabled=true
